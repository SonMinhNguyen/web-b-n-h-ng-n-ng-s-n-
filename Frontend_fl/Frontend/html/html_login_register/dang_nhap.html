<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Fresh Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex flex-col justify-between">

    <div id="header-container"></div>


    <main class="flex-grow flex items-center justify-center p-6 my-4">
        <div class="w-full max-w-5xl bg-white rounded-[40px] shadow-[0_20px_50px_rgba(0,0,0,0.08)] flex overflow-hidden border border-slate-100">
            
            <div class="hidden lg:block w-[45%] bg-[#eef7e6] relative p-12 flex flex-col justify-end">
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=800" 
                     class="absolute inset-0 w-full h-full object-cover opacity-90" alt="Fresh Food">
                <div class="relative z-10 bg-white/90 backdrop-blur p-8 rounded-3xl shadow-lg">
                    <h3 class="text-2xl font-black text-[#2f6b2f] mb-2">Chất lượng là ưu tiên</h3>
                    <p class="text-sm text-slate-600 font-medium leading-relaxed">Mỗi sản phẩm tại Fresh Mart đều được kiểm định khắt khe trước khi đến tay bạn.</p>
                </div>
            </div>

            <div class="w-full lg:w-[55%] p-10 md:p-16 flex flex-col justify-center">
                <div class="mb-10">
                    <h1 class="text-4xl font-black text-slate-800 mb-3">Chào mừng trở lại</h1>
                    <p class="text-slate-500 text-sm">Vui lòng nhập thông tin đăng nhập để tiếp tục mua sắm sạch.</p>
                </div>

                <form id="loginForm" class="space-y-5">
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest pl-1">Email tài khoản</label>
                        <input type="email" id="loginEmail" required placeholder="example@gmail.com" 
                               class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all font-semibold text-slate-700 text-sm">
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest pl-1">Mật khẩu bảo mật</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••" 
                               class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all font-semibold text-slate-700 text-sm">
                    </div>

                    <div class="flex items-center justify-between px-1 text-xs pt-1">
                        <label class="flex items-center gap-2 font-bold text-slate-400 cursor-pointer select-none">
                            <input type="checkbox" class="w-4 h-4 accent-green-700 rounded-lg cursor-pointer">
                            <span>Duy trì đăng nhập</span>
                        </label>
                        <a href="QuenMatKhau.html" onclick="localTriggerToast('Hệ thống: Tính năng khôi phục mật khẩu qua Email đang được bảo trì nâng cấp!')" class="font-black text-green-700 hover:text-green-900 transition-colors">
                            Quên mật khẩu?
                        </a>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-[#2f6b2f] text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-green-900 transition-all active:scale-[0.98] shadow-lg shadow-green-900/10">
                            <a href="../html_main/trang_chu.html">Đăng nhập</a>
                        </button>
                    </div>
                </form>

                <div class="text-center text-xs font-bold text-slate-400 mt-8 pt-4 border-t border-slate-100/70">
                    Chưa có tài khoản Fresh Mart? <a href="dang_ky.html" class="text-green-700 hover:underline ml-1">Đăng ký thành viên</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    


    <script src="../../assets/js/main.js"></script>

    <script>
        // Hàm hiển thị thông báo Toast nội bộ mượt mà không dùng Alert của trình duyệt
        function localTriggerToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            if (!toast || !msgEl) return;
            
            msgEl.innerText = msg;
            toast.style.opacity = '1'; 
            toast.style.transform = 'translate(-50%, -20px)';
            
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'translate(-50%, 40px)'; 
            }, 2500);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            // Cơ chế xử lý phân quyền và đồng bộ Auth Guard bằng Toast Message
            if (password === "123456789") {
                if (email === "admin@gmail.com") {
                    localStorage.setItem('user_role', 'admin');
                    localStorage.setItem('user_email', email);
                    localStorage.setItem('fresh_mart_is_logged_in', 'true');
                    localStorage.setItem('fresh_mart_user_name', 'Quản Trị Viên');
                    
                    localTriggerToast("Chào mừng Admin quay trở lại quản trị hệ thống!");
                    setTimeout(() => {
                        window.location.href = "../../admin/QuanLyDonHang.html";
                    }, 1000);
                } else if (email === "user@gmail.com") {
                    localStorage.setItem('user_role', 'user');
                    localStorage.setItem('user_email', email);
                    localStorage.setItem('fresh_mart_is_logged_in', 'true');
                    localStorage.setItem('fresh_mart_user_name', 'Ánh Tuyết');
                    
                    localTriggerToast("Đăng nhập tài khoản Fresh Mart thành công!");
                    setTimeout(() => {
                        window.location.href = "../html_main/trang_chu.html";
                    }, 1000);
                } else {
                    localTriggerToast("Tài khoản Email không tồn tại trên hệ thống!");
                }
            } else {
                localTriggerToast("Mật khẩu nhập vào không chính xác!");
            }
        });
    </script>
</body>
</html>
