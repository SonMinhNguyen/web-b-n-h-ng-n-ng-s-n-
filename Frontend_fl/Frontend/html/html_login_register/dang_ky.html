<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản | Fresh Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <main class="min-h-[85vh] flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-4xl bg-white rounded-[40px] shadow-2xl flex overflow-hidden border border-slate-100">
            
            <div class="hidden lg:flex w-1/3 bg-[#DCEBCF] p-12 flex-col justify-between relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-3xl font-black text-[#2f6b2f] mb-4">Gia nhập <br> Fresh Mart</h2>
                    <p class="text-[#396337] font-medium text-sm leading-relaxed opacity-80">Trở thành thành viên để tích điểm đổi quà và nhận những ưu đãi rau củ tươi sạch mỗi ngày.</p>
                </div>
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=800" 
                     class="absolute bottom-0 left-0 w-full object-cover opacity-60" alt="Vườn rau">
            </div>

            <div class="w-full lg:w-2/3 p-10 md:p-14">
                <div class="mb-8">
                    <h2 class="text-3xl font-black text-slate-800 mb-2">Đăng ký</h2>
                    <p class="text-slate-500 font-medium text-sm">Vui lòng điền thông tin để bắt đầu trải nghiệm</p>
                </div>

                <form class="space-y-5" id="registerForm">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Họ</label>
                            <input type="text" id="ho" required placeholder="Nguyễn" 
                                   class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Tên</label>
                            <input type="text" id="ten" required placeholder="Văn A" 
                                   class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Email</label>
                        <input type="email" id="email" required placeholder="name@email.com" 
                               class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all">
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Số điện thoại</label>
                        <input type="tel" id="sdt" required placeholder="0901 xxx xxx" 
                               class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Mật khẩu</label>
                            <input type="password" id="password" required placeholder="••••••••" 
                                   class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Xác nhận</label>
                            <input type="password" id="confirmPassword" required placeholder="••••••••" 
                                   class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-600 transition-all">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#2f6b2f] hover:bg-green-800 text-white font-black py-4 rounded-2xl transition-all transform active:scale-[0.98] shadow-lg shadow-green-900/20 uppercase tracking-widest mt-4">
                        Đăng ký tài khoản
                    </button>
                </form>

                <div class="text-center mt-8">
                    <span class="text-sm text-slate-500">Đã có tài khoản?</span>
                    <a href="dang_nhap.html" class="text-sm font-black text-green-700 hover:underline ml-1">Đăng nhập</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 translate-y-10 transition-all duration-500 z-[100] pointer-events-none text-sm font-medium">
        <span id="toast-message"></span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Chỉ load script logic đăng ký, main.js sẽ nạp header/footer
            initRegisterValidation();
        });

        function initRegisterValidation() {
            const registerForm = document.getElementById('registerForm');
            registerForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const ho = document.getElementById('ho').value.trim();
                const ten = document.getElementById('ten').value.trim();
                const email = document.getElementById('email').value.trim();
                const sdt = document.getElementById('sdt').value.trim();
                const pass = document.getElementById('password').value;
                const confirmPass = document.getElementById('confirmPassword').value;

                if (!ho || !ten || !email || !sdt || !pass || !confirmPass) {
                    triggerToast("⚠️ Vui lòng điền đầy đủ tất cả các trường thông tin!");
                    return;
                }
                if (pass !== confirmPass) {
                    triggerToast("❌ Mật khẩu xác nhận không khớp!");
                    return;
                }
                if (pass.length < 6) {
                    triggerToast("⚠️ Mật khẩu phải có ít nhất 6 ký tự!");
                    return;
                }

                triggerToast("✅ Đăng ký thành công! Đang chuyển hướng...");
                setTimeout(() => { window.location.href = "dang_nhap.html"; }, 2000);
            });
        }

        function triggerToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = msg;
            toast.style.opacity = '1'; 
            toast.style.transform = 'translate(-50%, -20px)';
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'translate(-50%, 40px)'; 
            }, 3000);
        }
    </script>
    <script src="../../assets/js/main.js"></script>
</body>
</html>
